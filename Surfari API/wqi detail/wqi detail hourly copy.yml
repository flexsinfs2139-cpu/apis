info:
  name: wqi detail hourly copy
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/wqi/detail/score-drivers?beachId={{SPOT_ID}}"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: beachId
      value: "{{SPOT_ID}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
