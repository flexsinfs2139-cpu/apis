info:
  name: send fcm
  type: http
  seq: 12

http:
  method: GET
  url: "{{BASE_URL}}/me/devices"
  body:
    type: json
    data: |-
      {
        "token": "THE_ACTUAL_FCM_TOKEN_FROM_FIREBASE",
        "platform": "ios", 
        "appVersion": "1.0.0"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
