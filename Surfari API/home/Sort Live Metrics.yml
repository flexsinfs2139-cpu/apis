info:
  name: Sort Live Metrics
  type: http
  seq: 6

http:
  method: PUT
  url: "{{BASE_URL}}/home/live-metrics"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "gridMetricIds": [
          "swellDir",
          "period",
          "tide",
          "uvIndex"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
