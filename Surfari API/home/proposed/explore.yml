info:
  name: explore
  type: http
  seq: 8

http:
  method: GET
  url: "{{BASE_URL}}/home/explore?limit=6&category=news"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  params:
    - name: limit
      value: "6"
      type: query
    - name: category
      value: news
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
