info:
  name: social-feed
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/home/social-feed?beachId=gordon-beach&page=1&limit=10"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  params:
    - name: beachId
      value: gordon-beach
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
