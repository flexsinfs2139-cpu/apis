info:
  name: spot-compare
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/home/spot-compare?beachIds=gordon-beach,hilton-beach"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  params:
    - name: beachIds
      value: gordon-beach,hilton-beach
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
