info:
  name: spot-details
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/home/spot-details?beachId=gordon-beach"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  params:
    - name: beachId
      value: gordon-beach
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
