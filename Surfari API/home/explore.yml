info:
  name: explore
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/home/explore-spots"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: pageSize
      value: "2"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
