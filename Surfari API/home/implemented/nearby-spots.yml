info:
  name: nearby-spots
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/home/nearby-spots?lat={{LATITUDE}}&lng={{LONGITUDE}}&page=1"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: lat
      value: "{{LATITUDE}}"
      type: query
    - name: lng
      value: "{{LONGITUDE}}"
      type: query
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "2"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
