info:
  name: accessibility
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{BASE_URL}}/settings/accessibility"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "largerText": true,
        "reduceMotion": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
