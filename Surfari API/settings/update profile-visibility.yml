info:
  name: update profile-visibility
  type: http
  seq: 11

http:
  method: PATCH
  url: "{{BASE_URL}}/settings/privacy/profile-visibility"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      { "profileVisibility": "followers" }

      // (values: public | followers | private)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
