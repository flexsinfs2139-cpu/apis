info:
  name: update unit
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{BASE_URL}}/settings/units"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "setting": "distance",
        "value": "miles"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
