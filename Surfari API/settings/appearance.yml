info:
  name: appearance
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{BASE_URL}}/settings/appearance"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: '{ "appearance": "light" }'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
