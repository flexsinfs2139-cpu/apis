info:
  name: update language
  type: http
  seq: 12

http:
  method: PATCH
  url: "{{BASE_URL}}/settings/language"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "language": "system"
      }
      // (values: system | english | hebrew)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
