info:
  name: update surfing skill
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{BASE_URL}}/settings/surfing/skill-level"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: '{ "skillLevel": "advanced" }'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
