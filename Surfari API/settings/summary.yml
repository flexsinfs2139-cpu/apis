info:
  name: summary
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/settings/summary"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
