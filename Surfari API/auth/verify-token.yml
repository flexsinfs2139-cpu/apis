info:
  name: verify-token
  type: http
  seq: 6

http:
  method: GET
  url: "{{BASE_URL}}/auth/verify-token"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
