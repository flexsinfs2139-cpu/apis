info:
  name: verify-email
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/auth/verify-email"
  headers:
    - name: Authorization
      value: " {{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "code": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
