info:
  name: forgot-password
  type: http
  seq: 7

http:
  method: POST
  url: "{{BASE_URL}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "allare@yopmail.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (response.success === true) {
          const forgetPassToken = response.data?.forget_pass_token;

          if (forgetPassToken) {
            // Save in the currently active environment
            bru.setEnvVar("FORGET_PASS_TOKEN", forgetPassToken);

            console.log("Forget password token saved to current environment");
          } else {
            console.error("Forget password token is missing from the response");
          }
        } else {
          console.error(`OTP request failed: ${response.message}`);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
