info:
  name: register
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "spotter.test@example.com",
        "password": "{{PASSWORD}}",
        "languageCode": "en",
        "regionCode": "IL",
        "firstName": "Spotter",
        "lastName": "Test",
        "phoneNumber": "1234567890",
        "consents": {
          "marketing": true,
          "personalisation": true,
          "analytics": true
        }
      }


      // Surfer - surfer.test@example.com
      // Spotter - spotter.test@example.com
      // Photographer - photographer.test@example.com
      // Business - business.test@example.com
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();

        if (response.status === "success") {
          const accessToken = response.data?.auth?.accessToken;
          const refreshToken = response.data?.auth?.refreshToken;

          if (!accessToken) {
            throw new Error("accessToken is missing from the response");
          }

          // Save in the currently active environment
          bru.setEnvVar("TOKEN", `Bearer ${accessToken}`);

          if (refreshToken) {
            bru.setEnvVar("REFRESH_TOKEN", refreshToken);
          }

          console.log("Authentication successful. Tokens saved.");
        } else {
          console.error(`Authentication failed: ${response.message}`);
          
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
