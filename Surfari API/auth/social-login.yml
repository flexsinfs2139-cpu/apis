info:
  name: social-login
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/auth/social-login"
  body:
    type: json
    data: |-
      {
        "provider": "google",
        "idToken": "<google-or-apple-id-token>",
        "languageCode": "en",
        "regionCode": "IL",
        "firstName": "Dana",
        "lastName": "Cohen"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
