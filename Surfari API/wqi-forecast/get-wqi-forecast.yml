info:
  name: get-wqi-forecast
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/wqi/forecast"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  body:
    type: json
    data: |-
      {
        "model": "claude-sonnet-4-6",
        "max_tokens": 4000,
        "system": "<generated prompt embedding BeachProfile + HourlyForecast[]>",
        "messages": [
          { "role": "user", "content": "Calculate the WQI forecast for the given hourly data." }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
