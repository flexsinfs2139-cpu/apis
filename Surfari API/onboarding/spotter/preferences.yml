info:
  name: preferences
  type: http
  seq: 2

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/spotter/preferences"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |
      {
        "goals": [
          "helpMyLocalSurfCommunity",
          "buildMySpotterReputation",
          "monitorMyFavouriteSpots",
          "beFirstToKnowAboutIncomingSwells",
          "earnKarmaAndRecognition"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
