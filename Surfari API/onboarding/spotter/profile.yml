info:
  name: profile
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/spotter/profile"
  headers:
    - name: Authorization
      value: " {{TOKEN}}"
  body:
    type: json
    data: |
      {
        "primarySpotId": "dolphinaruim",
        "primarySpot": {
          "name": "Dolphinarium Beach",
          "address": "Tel Aviv, Israel",
          "latitude": 32.0712,
          "longitude": 34.7618,
          "googleMapsUrl": "https://www.google.com/maps/search/?api=1&query=32.0712,34.7618"
        },
        "coverageArea": "central_coast",
        "reportTypes": [
          "conditions"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
