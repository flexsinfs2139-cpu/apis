info:
  name: profile
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/spotter/profile"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  body:
    type: json
    data: |-
      {
        "primarySpotId": "hilton",
        "primarySpot": {
          "name": "Hilton Beach",
          "address": "Hilton Beach, Tel Aviv",
          "latitude": 32.088,
          "longitude": 34.768,
          "googleMapsUrl": "https://www.google.com/maps/search/?api=1&query=32.088,34.768"
        },
        "coverageArea": "Tel Aviv coastline",
        "reportTypes": ["crowd", "waveHeight"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
