info:
  name: notifications
  type: http
  seq: 4

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/spotter/notifications"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  body:
    type: json
    data: |-
      {
        "spotNeedsReport": true,
        "swellEventIncoming": true,
        "karmaEarned": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
