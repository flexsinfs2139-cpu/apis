info:
  name: preferences
  type: http
  seq: 2

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/surfer/preferences"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "goals": ["findBestConditions", "logMySession", "discoverNewSpots"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
