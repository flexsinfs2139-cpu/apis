info:
  name: profile
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/surfer/profile"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "dateOfBirth": "1996-04-12",
        "gender": "male",
        "city": "Tel Aviv",
        "homeSpotId": "gordon",
        "homeSpot": {
          "name": "Gordon Beach",
          "address": "Gordon Beach, Tel Aviv",
          "latitude": 32.0839,
          "longitude": 34.7654,
          "googleMapsUrl": "https://www.google.com/maps/search/?api=1&query=32.0839,34.7654"
        },
        "skillLevel": "intermediate",
        "frequency": "weekly"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
