info:
  name: profile
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/surfer/profile"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |
      {
        "dateOfBirth": "1998-05-15",
        "gender": "male",
        "city": "Tel Aviv-Yafo",
        "homeSpotId": "gordon-beach",
        "homeSpot": {
          "name": "Gordon Beach",
          "address": "Herbert Samuel St, Tel Aviv, Israel",
          "latitude": 32.0831,
          "longitude": 34.7674,
          "googleMapsUrl": "https://www.google.com/maps/search/?api=1&query=32.0831,34.7674"
        },
        "skillLevel": "intermediate",
        "frequency": "few_times_a_week"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
