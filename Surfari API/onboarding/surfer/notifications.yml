info:
  name: notifications
  type: http
  seq: 4

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/surfer/notifications"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |
      {
        "swellAlerts": true,
        "liveCheckIns": true,
        "sessionPhotos": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
