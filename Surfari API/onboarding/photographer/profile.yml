info:
  name: profile
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/photographer/profile"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |
      {
        "homeSpotId": "hilton-beach",
        "homeSpot": {
          "name": "Hilton Beach",
          "address": "Tel Aviv, Israel",
          "latitude": 32.0898,
          "longitude": 34.7695,
          "googleMapsUrl": "https://www.google.com/maps/search/?api=1&query=32.0898,34.7695"
        },
        "equipment": [
          "dslrMirrorless",
          "telephotoLens",
          "waterHousing",
          "drone"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
