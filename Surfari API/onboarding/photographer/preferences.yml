info:
  name: preferences
  type: http
  seq: 2

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/photographer/preferences"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  body:
    type: json
    data: |-
      {
        "goals": ["getMoreSessionBookings", "sellPhotosToSurfers"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
