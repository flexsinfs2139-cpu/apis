info:
  name: submit-roles
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/onboarding/roles"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "roles": ["surfer"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
