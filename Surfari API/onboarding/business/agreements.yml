info:
  name: agreements
  type: http
  seq: 2

http:
  method: PUT
  url: "{{BASE_URL}}/onboarding/business/agreements"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  body:
    type: json
    data: |-
      {
        "authorization": true,
        "advertiserAndBilling": true,
        "handlingSurferData": true,
        "consoleAnalytics": true,
        "productAndAdvertiserUpdates": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
