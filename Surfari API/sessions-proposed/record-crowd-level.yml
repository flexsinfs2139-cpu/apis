info:
  name: record-crowd-level
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/sessions/{{sessionId}}/crowd"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  body:
    type: json
    data: |-
      {
        "level": "relaxed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
