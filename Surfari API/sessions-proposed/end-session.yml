info:
  name: end-session
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/sessions/{{sessionId}}/end"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  body:
    type: json
    data: |-
      {
        "location": {
          "lat": 12.345678,
          "lng": 78.901234,
          "accuracyM": 7.2
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
