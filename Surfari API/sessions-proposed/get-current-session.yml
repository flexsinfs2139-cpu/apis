info:
  name: get-current-session
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/sessions/current"
  headers:
    - name: Authorization
      value: Bearer {{TOKEN}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
