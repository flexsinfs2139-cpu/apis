info:
  name: profile status
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/profile/status"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
