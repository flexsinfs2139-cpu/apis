info:
  name: spot-tide-matrices
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/spot-tide-matrices?lat={{LATITUDE}}&lng={{LONGITUDE}}"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: lat
      value: "{{LATITUDE}}"
      type: query
    - name: lng
      value: "{{LONGITUDE}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
