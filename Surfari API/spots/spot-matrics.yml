info:
  name: spot-matrics
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/spot-matrics?lat={{LATITUDE}}&lng={{LONGITUDE}}"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: lat
      value: "{{LATITUDE}}"
      type: query
    - name: lng
      value: "{{LONGITUDE}}"
      type: query
    - name: date
      value: 2026-10-17
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
