info:
  name: forecast swell analysis
  type: http
  seq: 10

http:
  method: GET
  url: "{{BASE_URL}}/spots/forecast-swell-analysis?id={{SPOT_ID}}&lat={{LATITUDE}}&lng={{LONGITUDE}}"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: id
      value: "{{SPOT_ID}}"
      type: query
    - name: lat
      value: "{{LATITUDE}}"
      type: query
    - name: lng
      value: "{{LONGITUDE}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
