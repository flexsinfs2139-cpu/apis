info:
  name: Fetch Spots
  type: http
  seq: 13

http:
  method: GET
  url: "{{BASE_URL}}/spots?page=1&limit=5"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: query
      value: Noida
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
