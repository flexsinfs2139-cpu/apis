info:
  name: Fetch Nearby
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/nearby-spots?latitude=32.0886&longitude=34.7672"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: latitude
      value: "32.0886"
      type: query
    - name: longitude
      value: "34.7672"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
