info:
  name: weekly forecast
  type: http
  seq: 12

http:
  method: GET
  url: "{{BASE_URL}}/spots/weekly-overview?id={{SPOT_ID}}&lat={{LATITUDE}}&lng={{LONGITUDE}}&date="
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: id
      value: "{{SPOT_ID}}"
      type: query
    - name: lat
      value: "{{LATITUDE}}"
      type: query
    - name: lng
      value: "{{LONGITUDE}}"
      type: query
    - name: date
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
