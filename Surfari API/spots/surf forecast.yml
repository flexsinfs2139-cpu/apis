info:
  name: surf forecast
  type: http
  seq: 11

http:
  method: GET
  url: "{{BASE_URL}}/spots/surf-forecast?id={{SPOT_ID}}&lat={{LATITUDE}}&lng={{LONGITUDE}}&date=2026-09-19"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: id
      value: "{{SPOT_ID}}"
      type: query
    - name: lat
      value: "{{LATITUDE}}"
      type: query
    - name: lng
      value: "{{LONGITUDE}}"
      type: query
    - name: date
      value: 2026-09-19
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
