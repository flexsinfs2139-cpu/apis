info:
  name: surf forecast
  type: http
  seq: 11

http:
  method: GET
  url: "{{BASE_URL}}/spots/surf-forecast?id=320d05a0-7b64-435f-b803-f9c0e79177c6&lat={{LATITUDE}}&lng={{LONGITUDE}}&date=2026-09-11"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: id
      value: 320d05a0-7b64-435f-b803-f9c0e79177c6
      type: query
    - name: lat
      value: "{{LATITUDE}}"
      type: query
    - name: lng
      value: "{{LONGITUDE}}"
      type: query
    - name: date
      value: 2026-09-11
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
