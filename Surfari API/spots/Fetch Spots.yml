info:
  name: Fetch Spots
  type: http
  seq: 8

http:
  method: GET
  url: "{{BASE_URL}}/spots?search="
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: search
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
