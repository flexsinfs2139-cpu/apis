info:
  name: fetch spots
  type: http
  seq: 7

http:
  method: GET
  url: "{{BASE_URL}}/spots?search=Hilton"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: search
      value: Hilton
      type: query
    - name: lat
      value: "{{LATITUDE}}"
      type: query
      disabled: true
    - name: lng
      value: "{{LONGITUDE}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
