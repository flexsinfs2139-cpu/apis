info:
  name: fetch nearby spots
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/nearby-spots?latitude={{LATITUDE}}&longitude={{LONGITUDE}}"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: latitude
      value: "{{LATITUDE}}"
      type: query
    - name: longitude
      value: "{{LONGITUDE}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
