info:
  name: forecast incoming swell
  type: http
  seq: 8

http:
  method: GET
  url: "{{BASE_URL}}/spots/incoming-swell?id={{SPOT_ID}}"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: id
      value: "{{SPOT_ID}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
