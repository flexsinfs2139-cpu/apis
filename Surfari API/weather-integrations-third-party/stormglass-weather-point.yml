info:
  name: stormglass-weather-point
  type: http
  seq: 1

http:
  method: GET
  url: https://api.stormglass.io/v2/weather/point?lat=32.0839&lng=34.7654&params=waveHeight,swellHeight,swellPeriod,swellDirection,wavePeriod,waveDirection,windWaveHeight,windWavePeriod,windWaveDirection,windSpeed,windDirection,gust,waterTemperature,airTemperature,precipitation,seaLevel&source=sg
  headers:
    - name: Authorization
      value: <stormglass-api-key>
  params:
    - name: lat
      value: "32.0839"
      type: query
    - name: lng
      value: "34.7654"
      type: query
    - name: params
      value: waveHeight,swellHeight,swellPeriod,swellDirection,wavePeriod,waveDirection,windWaveHeight,windWavePeriod,windWaveDirection,windSpeed,windDirection,gust,waterTemperature,airTemperature,precipitation,seaLevel
      type: query
    - name: source
      value: sg
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
