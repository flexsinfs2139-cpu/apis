info:
  name: openstreetmap reverse geocode copy
  type: http
  seq: 8

http:
  method: GET
  url: https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat={{LATITUDE}}&lon={{LONGITUDE}}&addressdetails=1&accept-language=en
  params:
    - name: format
      value: jsonv2
      type: query
    - name: lat
      value: "{{LATITUDE}}"
      type: query
    - name: lon
      value: "{{LONGITUDE}}"
      type: query
    - name: addressdetails
      value: "1"
      type: query
    - name: accept-language
      value: en
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
