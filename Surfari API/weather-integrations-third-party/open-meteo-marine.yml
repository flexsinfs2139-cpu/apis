info:
  name: open-meteo-marine
  type: http
  seq: 3

http:
  method: GET
  url: https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current=temperature_2m,wind_speed_10m&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m&past_days=10
  params:
    - name: latitude
      value: "52.52"
      type: query
    - name: longitude
      value: "13.41"
      type: query
    - name: current
      value: temperature_2m,wind_speed_10m
      type: query
    - name: hourly
      value: temperature_2m,relative_humidity_2m,wind_speed_10m
      type: query
    - name: past_days
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
