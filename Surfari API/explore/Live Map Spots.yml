info:
  name: Live Map Spots
  type: http
  seq: 12

http:
  method: GET
  url: "{{BASE_URL}}/explore/spots/?lat={{LATITUDE}}&lng={{LONGITUDE}}&page=1&limit=50"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: lat
      value: "{{LATITUDE}}"
      type: query
    - name: lng
      value: "{{LONGITUDE}}"
      type: query
    - name: query
      value: Hilton
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "50"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
