info:
  name: Trending spots
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/explore/trending-spots?lat=32.085452&lng=34.770123&page=1&pageSize=2"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: lat
      value: "32.085452"
      type: query
    - name: lng
      value: "34.770123"
      type: query
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
