info:
  name: Live map, spot forecast
  type: http
  seq: 13

http:
  method: GET
  url: "{{BASE_URL}}/explore/spots/{{SPOT_ID}}/forecast"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
