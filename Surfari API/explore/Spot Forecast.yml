info:
  name: Spot Forecast
  type: http
  seq: 14

http:
  method: GET
  url: "{{BASE_URL}}/explore/spots-forecast?date=2026-09-21&hour=14&page=1&limit=20"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: date
      value: 2026-09-21
      type: query
    - name: hour
      value: "14"
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
