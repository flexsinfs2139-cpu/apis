info:
  name: Spot Detail - Surf Report
  type: http
  seq: 9

http:
  method: GET
  url: "{{BASE_URL}}/explore/spots/{{SPOT_ID}}/surf-reports?page=1&limit=5"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
